<!DOCTYPE html>
<!--
  Local Razorpay Test Mode checkout harness for end-to-end webhook testing.
  NOT app code — the Flutter app opens Checkout via its own SDK. This exists
  only to reproduce the payment flow in a browser during debugging.

  Usage:
    1. `create-razorpay-order` has already created an order server-side; paste
       its id below (ORDER_ID) — this page does NOT create the order, so we
       test the exact order (with notes.invoice_id) that the webhook will see.
    2. Open this file in a browser, click Pay, complete Test Mode checkout.
    3. Razorpay fires payment.captured -> our razorpay-webhook function.

  Only the PUBLIC test key_id is here. No secret. Safe to keep in-repo.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Razorpay Webhook Test Harness</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
    button { font-size: 16px; padding: 12px 24px; cursor: pointer; }
    .row { margin: 12px 0; }
    #out { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; border-radius: 6px; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Razorpay Test Mode — Webhook E2E Harness</h2>
  <div class="row">Order: <code id="oid"></code></div>
  <div class="row">Invoice: <code>55555555-5555-5555-5555-555555555555</code> (₹1000)</div>
  <div class="row"><button onclick="pay()">Pay ₹1000 (Test Mode)</button></div>
  <div id="out">Ready. Use Netbanking at checkout, same as before.</div>

  <script>
    // Public Razorpay Test Mode key_id (not a secret).
    const KEY_ID = "rzp_test_TFTM0iK32mVuvJ";
    // Order created server-side by create-razorpay-order (notes.invoice_id set).
    const ORDER_ID = "order_TGKm4lnvod7S1I";

    document.getElementById("oid").textContent = ORDER_ID;
    const out = (m) => document.getElementById("out").textContent = m;

    function pay() {
      const rzp = new Razorpay({
        key: KEY_ID,
        order_id: ORDER_ID,
        name: "School ERP — Fee Payment",
        description: "Test invoice ...555",
        handler: function (resp) {
          // This is the CLIENT callback — informational only. The webhook is
          // what actually records the payment. We deliberately do NOT trust this.
          out("Client callback (NOT authoritative):\n" + JSON.stringify(resp, null, 2)
            + "\n\nNow tell the agent payment is complete so it can check the DB + webhook delivery.");
        },
        modal: { ondismiss: () => out("Checkout dismissed — no payment made.") },
      });
      rzp.on("payment.failed", (resp) => out("payment.failed:\n" + JSON.stringify(resp.error, null, 2)));
      rzp.open();
    }
  </script>
</body>
</html>
