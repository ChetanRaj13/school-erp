name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter pub get
      - run: flutter analyze

  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [timetable-solver, document-extraction, predictive-engine, omr-pipeline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
