name: school_erp
description: Unified school ERP — FinTech + Future Ready Ops hackathon build.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  go_router: ^14.0.0
  http: ^1.2.0                    # app -> FastAPI microservices (OMR /scan, documents /commit)
  image_picker: ^1.1.0            # OMR sheet photo capture/selection
  razorpay_flutter: ^1.3.7          # Razorpay Checkout SDK (Test Mode)
  pdf: ^3.11.1
  url_launcher: ^6.3.1
  file_picker: ^8.1.6
  web: ^1.1.1
  intl: ^0.18.1
  collection: ^1.18.0              # For firstWhereOrNull and other collection utilities
  google_fonts: ^6.2.1              # Instrument Serif + Inter for the cinematic hero header

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true 
  assets:
    - assets/omr/
    - assets/backgrounds/