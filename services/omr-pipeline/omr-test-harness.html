<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMR Scan Test Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.6rem; font-weight: 700; color: #a78bfa; margin-bottom: 0.25rem; }
    .subtitle { color: #64748b; font-size: 0.875rem; margin-bottom: 2rem; }
    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.35rem; margin-top: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    label:first-child { margin-top: 0; }
    input[type="text"], input[type="file"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="file"]:focus { border-color: #a78bfa; }
    input[type="file"] { cursor: pointer; }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: #64748b; min-height: 1.2em; }
    .status.error { color: #f87171; }
    .status.ok { color: #34d399; }
    #summary-box {
      display: none;
      margin-top: 1.5rem;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .stat {
      background: #0f1117;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat .number { font-size: 2rem; font-weight: 800; }
    .stat .label { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }
    .stat.present .number { color: #34d399; }
    .stat.absent .number { color: #f87171; }
    .stat.review .number { color: #fbbf24; }
    .stat.total .number { color: #a78bfa; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }
    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      background: #0f1117;
      color: #64748b;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { padding: 0.5rem 0.75rem; border-top: 1px solid #2d3148; vertical-align: top; }
    tr.needs-review td { background: rgba(251, 191, 36, 0.06); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.present { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .badge.absent  { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .badge.review  { background: rgba(251, 191, 36, 0.15);  color: #fbbf24; }
    .badge.unknown { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
    .raw-json {
      background: #0f1117;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.75rem;
      color: #64748b;
      overflow-x: auto;
      white-space: pre;
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    a { color: #a78bfa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🔬 OMR Scan Test Harness</h1>
  <p class="subtitle">Standalone tester for the /scan endpoint — not part of the production app</p>

  <div class="card">
    <label for="endpoint">API Endpoint</label>
    <input type="text" id="endpoint" value="http://localhost:8002/scan" />

    <label for="class-id">Class ID (academic.classes.id UUID)</label>
    <input type="text" id="class-id" value="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" placeholder="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" />

    <label for="date-field">Date (YYYY-MM-DD, leave blank for today)</label>
    <input type="text" id="date-field" placeholder="2026-07-22" />

    <label for="image-file">OMR Sheet Photo (jpg/png)</label>
    <input type="file" id="image-file" accept="image/jpeg,image/png,image/jpg" />

    <label for="template-file">Template JSON (class_*_template.json)</label>
    <input type="file" id="template-file" accept="application/json,.json" />

    <button id="scan-btn" onclick="runScan()">Run Scan →</button>
    <div class="status" id="status-msg"></div>
  </div>

  <div id="summary-box" class="card">
    <div class="section-title">Summary</div>
    <div class="summary-grid">
      <div class="stat total"><div class="number" id="s-total">—</div><div class="label">Total</div></div>
      <div class="stat present"><div class="number" id="s-present">—</div><div class="label">Present</div></div>
      <div class="stat absent"><div class="number" id="s-absent">—</div><div class="label">Absent</div></div>
      <div class="stat review"><div class="number" id="s-review">—</div><div class="label">Needs Review</div></div>
    </div>

    <div class="section-title" style="margin-top:1.25rem">Per-Student Breakdown</div>
    <table>
      <thead>
        <tr>
          <th>Roll</th>
          <th>Name</th>
          <th>Status</th>
          <th>Confidence</th>
          <th>Review Reason</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>

    <div class="section-title" style="margin-top:1.25rem">Raw JSON Response</div>
    <div class="raw-json" id="raw-json"></div>
  </div>

  <script>
    async function runScan() {
      const btn = document.getElementById('scan-btn');
      const statusEl = document.getElementById('status-msg');
      const endpoint = document.getElementById('endpoint').value.trim();
      const classId  = document.getElementById('class-id').value.trim();
      const dateVal  = document.getElementById('date-field').value.trim();
      const imageFile   = document.getElementById('image-file').files[0];
      const templateFile = document.getElementById('template-file').files[0];

      statusEl.className = 'status';
      document.getElementById('summary-box').style.display = 'none';

      if (!imageFile)    { statusEl.textContent = 'Please select an OMR sheet photo.'; statusEl.className='status error'; return; }
      if (!templateFile) { statusEl.textContent = 'Please select the template.json file.'; statusEl.className='status error'; return; }
      if (!classId)      { statusEl.textContent = 'Please enter a Class ID.'; statusEl.className='status error'; return; }

      btn.disabled = true;
      statusEl.textContent = 'Uploading and scanning… this may take a few seconds.';

      const form = new FormData();
      form.append('image', imageFile);
      form.append('template', templateFile);
      form.append('class_id', classId);
      if (dateVal) form.append('date', dateVal);

      try {
        const res = await fetch(endpoint, { method: 'POST', body: form });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = `Error ${res.status}: ${data.detail || JSON.stringify(data)}`;
          statusEl.className = 'status error';
          return;
        }

        // Populate summary
        document.getElementById('s-total').textContent   = data.summary.total;
        document.getElementById('s-present').textContent = data.summary.present;
        document.getElementById('s-absent').textContent  = data.summary.absent;
        document.getElementById('s-review').textContent  = data.summary.needs_review;

        // Populate table
        const tbody = document.getElementById('results-body');
        tbody.innerHTML = '';
        for (const r of (data.records || [])) {
          const tr = document.createElement('tr');
          if (r.needs_review) tr.className = 'needs-review';

          const statusBadge = r.needs_review
            ? '<span class="badge review">⚠ Review</span>'
            : r.status === 'present'
              ? '<span class="badge present">✓ Present</span>'
              : r.status === 'absent'
                ? '<span class="badge absent">✗ Absent</span>'
                : '<span class="badge unknown">—</span>';

          tr.innerHTML = `
            <td>${r.roll_no}</td>
            <td>${r.student_name || '<em style="color:#475569">No match</em>'}</td>
            <td>${statusBadge}</td>
            <td>${(r.confidence * 100).toFixed(1)}%</td>
            <td style="color:#fbbf24;font-size:0.78rem">${r.review_reason || ''}</td>
          `;
          tbody.appendChild(tr);
        }

        document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2);
        document.getElementById('summary-box').style.display = 'block';
        statusEl.textContent = `✓ Done — ${data.inserted} row(s) inserted into attendance.records`;
        statusEl.className = 'status ok';
      } catch (err) {
        statusEl.textContent = `Network error: ${err.message}. Is the server running at ${endpoint}?`;
        statusEl.className = 'status error';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
